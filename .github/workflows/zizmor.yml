name: zizmor

# Static analysis of the GitHub Actions workflows (https://docs.zizmor.sh/).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning (pushes to main)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"
          persona: pedantic
          # On main: upload SARIF to the Security tab. On PRs (fork tokens cannot upload SARIF):
          # fail the job and annotate the diff instead.
          advanced-security: ${{ github.event_name != 'pull_request' }}
          annotations: ${{ github.event_name == 'pull_request' }}
