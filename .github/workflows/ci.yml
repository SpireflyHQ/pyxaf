name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on pull requests; let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  # Fail instead of silently re-locking when uv.lock is out of date with pyproject.toml.
  UV_LOCKED: "1"
  UV_NO_PROGRESS: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: ruff check
        run: uv run --only-group lint ruff check --output-format=github
      - name: ruff format --check
        run: uv run --only-group lint ruff format --check --diff

  typing:
    name: Typing (mypy, pyright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install (all extras, so optional imports type-check)
        run: uv sync --all-extras
      - name: mypy --strict
        run: uv run --all-extras mypy
      - name: pyright --verifytypes (public API completeness)
        continue-on-error: true
        run: uv run --all-extras pyright --verifytypes pyxaf --ignoreexternal
      - name: ty (preview, non-blocking)
        continue-on-error: true
        run: uvx --python 3.11 ty@0.0.84 check src/pyxaf

  tests:
    name: Tests (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: pytest (all extras)
        run: uv run --all-extras pytest --cov --cov-report=term

  no-extras:
    # Proves the core wheel installs and works with zero third-party runtime packages.
    name: Core without extras (wheel, 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Build the wheel
        run: uv build --wheel --no-sources --out-dir dist
      - name: Install the wheel into a fresh, empty venv
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/core"
          uv pip install --python "$RUNNER_TEMP/core" dist/*.whl
          echo "Installed packages:"
          uv pip list --python "$RUNNER_TEMP/core"
      - name: Import smoke test (no third-party packages present)
        run: |
          "$RUNNER_TEMP/core/bin/python" -I - <<'PY'
          import importlib.metadata as md
          import importlib.util
          import sys

          dists = sorted(d.metadata["Name"].lower() for d in md.distributions())
          assert dists == ["pyxaf"], f"unexpected distributions: {dists}"
          for extra in ("lxml", "nanoarrow", "polars", "pandas", "pyarrow", "typer", "click"):
              assert importlib.util.find_spec(extra) is None, f"{extra} must not be installed"

          import pyxaf
          from pyxaf import detect, open, validate  # noqa: F401

          assert "site-packages" in pyxaf.__file__, pyxaf.__file__
          print("pyxaf", pyxaf.__version__, "imported from", pyxaf.__file__, "on", sys.version)
          PY
      - name: CLI without the 'cli' extra prints the install hint (exit code 3)
        run: |
          set +e
          "$RUNNER_TEMP/core/bin/pyxaf" --help 2> "$RUNNER_TEMP/cli.err"
          code=$?
          set -e
          cat "$RUNNER_TEMP/cli.err"
          test "$code" -eq 3
          grep -q "pyxaf\[cli\]" "$RUNNER_TEMP/cli.err"
      - name: Add only the test tools (pytest, hypothesis) to the venv
        run: |
          uv export --only-group test --no-emit-project --format requirements.txt \
            --output-file "$RUNNER_TEMP/test-requirements.txt"
          uv pip install --python "$RUNNER_TEMP/core" -r "$RUNNER_TEMP/test-requirements.txt"
      - name: pytest -m "not extras" against the installed wheel
        run: '"$RUNNER_TEMP/core/bin/python" -m pytest -m "not extras" -p no:cacheprovider'

  generated:
    # The field catalogues and reference pages are generated; fail when they are stale.
    name: Generated files up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Regenerate the field catalogues
        run: uv run --no-default-groups --group gen python scripts/gen_catalogues.py
      - name: Regenerate the reference pages
        run: uv run --no-default-groups python scripts/gen_docs.py
      - name: Fail on differences
        run: |
          git add --intent-to-add --all
          git diff --exit-code --stat -- src/pyxaf/catalogue docs/reference

  experimental:
    name: Experimental (${{ matrix.python }}, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 3.14t = free-threaded build. Extras (pyarrow, polars, …) may lack wheels here, so only the
        # core test suite runs.
        python: ["3.14t", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: pytest (core only)
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          # Only free-threaded builds accept PYTHON_GIL=0; regular builds abort on it.
          if [[ "$PYTHON" == *t ]]; then export PYTHON_GIL=0; fi
          uv run --no-default-groups --group test pytest -m "not extras"

  benchmark:
    name: Benchmark (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Run benchmarks/run.py
        run: uv run --all-extras python benchmarks/run.py --lines 200000

  ci-ok:
    # Single required status check for branch protection.
    name: CI OK
    if: always()
    needs: [lint, typing, tests, no-extras, generated]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then exit 1; fi
          done
