name: zizmor

# Static analysis of the GitHub Actions workflows (https://docs.zizmor.sh/).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning (pushes to main)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: "1.30.1"
          persona: pedantic
          # Public repo, push to main: upload SARIF to the Security tab. Pull requests (fork tokens
          # cannot upload SARIF) and private repos (code scanning needs GitHub Advanced Security):
          # fail the job and annotate the diff instead.
          advanced-security: ${{ github.event_name != 'pull_request' && !github.event.repository.private }}
          annotations: ${{ github.event_name == 'pull_request' || github.event.repository.private }}
